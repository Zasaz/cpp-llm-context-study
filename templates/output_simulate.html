<div class="simulation-view">
    {% if result.error %}
    <div class="error-message">
        <strong>Error:</strong>
        <pre>{{ result.error }}</pre>
    </div>
    {% elif result.simulation_steps and result.simulation_steps|length > 0 %}

    <!-- Stepper Timeline -->
    <div class="simulation-stepper" id="simulationOverviewMap">
        <!-- Stepper items will be generated by JavaScript -->
    </div>

    <!-- Display & Controls -->
    <div>
        <div class="simulation-step-display">
            <h5 class="simulation-title" id="currentStepTitle"></h5>
            <div class="simulation-narrative markdown-content" id="currentStepNarrative"></div>
            <div class="simulation-state-changes" id="currentStateChangesContainer" style="display: none;">
                <h6>State Updates</h6>
                <ul id="currentStateChangesList"></ul>
            </div>
        </div>
        <div class="simulation-controls" style="margin-top: 1rem;">
            <button type="button" id="simPrevStep" class="button" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-6-6 6-6"></path>
                </svg>
                <span>Previous</span>
            </button>
            <span id="simStepCounter"
                style="color: var(--text-secondary); font-size: 0.875rem; font-weight: 500;"></span>
            <button type="button" id="simNextStep" class="button">
                <span>Next</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m9 18 6-6-6-6"></path>
                </svg>
            </button>
        </div>
    </div>

    <div id="simulationData" style="display: none;">{{ result.simulation_steps | tojson | safe }}</div>

    {% else %}
    <p style="color: var(--text-secondary);">No simulation steps were generated for this project.</p>
    {% endif %}
</div>

<script>
    if (!window.simulationScriptLoaded && document.getElementById('simulationData')) {
        window.simulationScriptLoaded = true;

        document.addEventListener('DOMContentLoaded', function () {
            const dataEl = document.getElementById('simulationData');
            if (!dataEl) return;

            try {
                const steps = JSON.parse(dataEl.textContent);
                if (!steps || steps.length === 0) return;

                const overviewMap = document.getElementById('simulationOverviewMap');
                const prevBtn = document.getElementById('simPrevStep');
                const nextBtn = document.getElementById('simNextStep');
                const counter = document.getElementById('simStepCounter');
                const titleEl = document.getElementById('currentStepTitle');
                const narrativeEl = document.getElementById('currentStepNarrative');
                const changesContainer = document.getElementById('currentStateChangesContainer');
                const changesList = document.getElementById('currentStateChangesList');

                let currentStepIndex = 0;

                function populateOverviewMap() {
                    overviewMap.innerHTML = '';
                    steps.forEach((step, index) => {
                        const item = document.createElement('div');
                        item.className = 'stepper-item';
                        item.dataset.stepIndex = index;
                        item.id = `map-step-${index}`;
                        item.innerHTML = `<div class="stepper-item-number">${index + 1}</div>`;
                        item.setAttribute('title', step.title || `Step ${index + 1}`);

                        item.addEventListener('click', () => displayStep(index));
                        overviewMap.appendChild(item);

                        if (index < steps.length - 1) {
                            const connector = document.createElement('div');
                            connector.className = 'stepper-connector';
                            overviewMap.appendChild(connector);
                        }
                    });
                }

                function displayStep(index) {
                    currentStepIndex = index;
                    const step = steps[index];

                    titleEl.textContent = step.title || `Step ${index + 1}`;
                    narrativeEl.innerHTML = step.narrative_html || "<p>No narrative for this step.</p>";

                    if (step.state_changes && step.state_changes.length > 0) {
                        changesList.innerHTML = '';
                        step.state_changes.forEach(change => {
                            const li = document.createElement('li');
                            li.innerHTML = `
                            <span class="state-variable">${escapeHtml(change.variable)}:</span>
                            <span class="state-value-old">${escapeHtml(change.from_value)}</span>
                            <span>&rarr;</span>
                            <span class="state-value-new">${escapeHtml(change.to_value)}</span>
                        `;
                            changesList.appendChild(li);
                        });
                        changesContainer.style.display = 'block';
                    } else {
                        changesContainer.style.display = 'none';
                    }

                    counter.textContent = `Step ${index + 1} of ${steps.length}`;
                    prevBtn.disabled = (index === 0);
                    nextBtn.disabled = (index === steps.length - 1);

                    document.querySelectorAll('.stepper-item').forEach(el => el.classList.remove('active'));
                    document.getElementById(`map-step-${index}`)?.classList.add('active');
                }

                function escapeHtml(unsafe) {
                    if (unsafe === null || typeof unsafe === 'undefined') return '';
                    return String(unsafe).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
                }

                prevBtn.addEventListener('click', () => { if (currentStepIndex > 0) displayStep(currentStepIndex - 1); });
                nextBtn.addEventListener('click', () => { if (currentStepIndex < steps.length - 1) displayStep(currentStepIndex + 1); });

                populateOverviewMap();
                displayStep(0);

            } catch (e) {
                console.error("Error initializing simulation:", e);
            }
        });
    }
</script>
